<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de servicio</title>
<style>
:root{--bg:#eceef2;--panel:#fff;--fg:#1b1d24;--mut:#6a6f7d;--acc:#c8102e;--accfg:#fff;--bd:#cfd3dc;--in:#f6f7fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--panel:#1f222a;--fg:#e8eaf0;--mut:#9aa0b0;--acc:#e0455b;--bd:#363a46;--in:#14161b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1f222a;--fg:#e8eaf0;--mut:#9aa0b0;--acc:#e0455b;--bd:#363a46;--in:#14161b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:8px 12px;overflow-x:auto;white-space:nowrap}
header b{font-size:16px;margin-right:6px}
header input{width:200px;margin-left:auto}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5}
main{max-width:900px;margin:0 auto;padding:14px 12px 70px}
.sec{background:var(--panel);border:1px solid var(--bd);margin-bottom:12px;border-radius:6px;overflow:hidden}
.sec h2{margin:0;background:#000;color:#fff;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px}
.body{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f{display:block}.f>span,.grp>b{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.f.w2{grid-column:span 2}.full{grid-column:1/-1}
@media (max-width:520px){.f.w2{grid-column:auto}}
input:not([type=checkbox]):not([type=radio]),textarea{width:100%;font:inherit;color:var(--fg);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:7px 9px}
textarea{resize:vertical}
.ck{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.tr{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;align-items:center}
.tr.p{grid-template-columns:90px 1.4fr 1fr 1fr}
.tr b{font-size:13px}
@media (max-width:640px){.tr,.tr.p{grid-template-columns:1fr 1fr}.tr b{grid-column:1/-1}}
.vc{border:1px solid var(--bd);border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.big{display:flex;gap:18px;font-size:16px;font-weight:600}
#pad{width:100%;max-width:460px;height:130px;background:#fff;border:1px solid var(--bd);border-radius:8px;touch-action:none;cursor:crosshair}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.note{color:var(--mut);font-size:13px;margin:0}
</style>
</head>
<body>
<header>
  <b>🚒 Informe de servicio</b>
  <button id="bNew">Nuevo</button>
  <button id="bPdf">⬇ PDF</button>
  <button id="bSend" class="pri">✉ Enviar</button>
  <input id="to" type="email" placeholder="Enviar a (correo)">
</header>
<main id="form"></main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),KEY='informe-servicio-v1';
const el=(t,p={},...k)=>{const e=Object.assign(document.createElement(t),p);e.append(...k);return e};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)};
const fd=s=>s?s.split('-').reverse().join('/'):'';

const CG={
 inc:['Incidencias generales',[['edif','Edificación / Inmueble'],['veg','Vegetación / Forestal'],['veh','Vehículo / Transporte']]],
 sin:['Siniestros y rescates',[['trafico','Accidente Tráfico'],['medio','Rescate Medio Natural'],['viv','Apertura de Vivienda']]],
 act:['Actuaciones operativas',[['sane','Saneamiento / Estructura'],['gas','Fuga Gas / R. Químico'],['obst','Retirada Obstáculos']]],
 man:['Mantenimiento y prevención',[['insp','Inspección / Retén'],['falsa','Falsa Alarma'],['asist','Asistencia Técnica']]],
 epi:['Equipos de protección utilizados',[['era','EPI Pesado con ERA'],['sinera','EPI Pesado sin ERA'],['acu','EPI Acuático'],['for','EPI Forestal'],['par','EPI de Parque'],['otro','Otro EPI']]],
 est:['Afectación estructural / riesgo',[['s0','Sin riesgo colapso'],['forj','Daños en forjado'],['prec','Inmueble precintado'],['rc','Riesgo colapso inminente'],['fuego','Daños por fuego/carga'],['apun','Apuntalamiento necesario']]],
 cue:['Cuerpos actuantes en el lugar',[['sem','S.E.M.'],['mos',"Mossos d'Esquadra"],['gub','GUB'],['pl','PL'],['otros','Otros']]],
 tec:['Técnicas de rescate / extracción',[['rau','Extracción rápida (Rautek)'],['exc','Excarcelación pesada (Corte/Separador)'],['alt','Rescate en altura (Autoescala / Cuerdas)'],['bus','Búsqueda en estructura colapsada']]],
 vit:['Soporte vital / primera atención bomberos',[['oxi','Oxigenoterapia / Vía Aérea'],['hem','Control de Hemorragias (Torniquete)'],['inm','Inmovilización (Collarín/Tablero)'],['rcp','RCP Básico / Reanimación']]]
};
const TIMES=[['aviso','Aviso 112'],['salida','Salida'],['llegada','Llegada lugar'],['control','Control incidente'],['fin','Fin servicio'],['regreso','Regreso base']];
const PERS=['SCTE','5-06-90','Cap Intervenció','Cap Dotació',...Array.from({length:10},(_,i)=>'B-'+(i+1))];
const TR=[['T1','T1 Rojo'],['T2','T2 Amar.'],['T3','T3 Verde'],['T4','T4/F Negro']];

let D={};
try{D=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
if(!D.fecha)D.fecha=new Date().toISOString().slice(0,10);
let pt;const persist=()=>{clearTimeout(pt);pt=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}},300)};

/* ---------- Formulario ---------- */
function fld(k,l,type='text',cls=''){
  const i=type==='area'?el('textarea',{rows:6}):el('input',{type});i.value=D[k]||'';i.oninput=()=>{D[k]=i.value;persist()};
  return el('label',{className:'f '+cls},el('span',{textContent:l}),i);
}
function mini(k,ph){const i=el('input',{type:'text',placeholder:ph});i.value=D[k]||'';i.oninput=()=>{D[k]=i.value;persist()};return i}
function grp(g,cls=''){
  const[t,it]=CG[g],w=el('div',{className:'grp '+cls},el('b',{textContent:t}));
  it.forEach(([k,l])=>{const c=el('input',{type:'checkbox',checked:!!D[g+'.'+k]});c.onchange=()=>{D[g+'.'+k]=c.checked;persist()};w.append(el('label',{className:'ck'},c,l))});
  return w;
}
const sec=(t,...k)=>el('section',{className:'sec'},el('h2',{textContent:t}),el('div',{className:'body'},...k));

function pad(){
  const c=el('canvas',{id:'pad',width:920,height:260}),x=c.getContext('2d');let on=false;
  const drawSavedFirma=()=>{
    x.clearRect(0,0,c.width,c.height);
    if(!D.firma)return;
    const im=new Image();
    im.onload=()=>{x.clearRect(0,0,c.width,c.height);const scale=Math.min(c.width/im.width,c.height/im.height);const w=im.width*scale,h=im.height*scale;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)};
    im.src=D.firma;
  };
  if(D.firma)drawSavedFirma();
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.strokeStyle='#111';x.lineWidth=5;x.lineCap=x.lineJoin='round';x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
  c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{if(!on)return;on=false;D.firma=c.toDataURL('image/png');persist()};
  const file=el('input',{type:'file',accept:'image/png,image/jpeg,image/webp',style:'display:block;margin:8px 0'});
  file.onchange=()=>{
    const f=file.files&&file.files[0];if(!f)return;
    if(!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('Selecciona una imagen PNG, JPG o WEBP');file.value='';return}
    const reader=new FileReader();
    reader.onerror=()=>toast('No se pudo leer la imagen');
    reader.onload=()=>{
      const im=new Image();
      im.onerror=()=>toast('No se pudo abrir la imagen');
      im.onload=()=>{
        x.clearRect(0,0,c.width,c.height);
        const scale=Math.min(c.width/im.width,c.height/im.height);
        const w=im.width*scale,h=im.height*scale;
        x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);
        D.firma=c.toDataURL('image/png');persist();
        toast('Firma cargada; aparecerá en el PDF');
      };
      im.src=reader.result;
    };
    reader.readAsDataURL(f);
  };
  const clear=()=>{x.clearRect(0,0,c.width,c.height);D.firma='';file.value='';persist()};
  return el('div',{className:'f full'},el('span',{textContent:'Firma (puedes dibujarla o subir una imagen)'}),c,
    el('div',{},el('label',{},'Subir firma desde imagen ',file)),
    el('div',{},el('button',{textContent:'Borrar firma',onclick:clear})));
}

function render(){
  const F=$('#form');F.replaceChildren();
  F.append(sec('1. Datos generales y localización',
    fld('inf','Colaboración del 112 · INF-'),fld('fecha','Fecha del servicio','date'),fld('zona','Zona de localización (ABP)'),fld('lugar','Lugar de salida'),
    fld('motivo','Motivo inicial de alerta'),fld('muni','Municipio / Distrito'),fld('dir','Dirección precisa / punto kilométrico / referencia','text','w2'),
    ...TIMES.map(([k,l])=>fld(k,l,'time'))));
  F.append(sec('2. Clasificación general de la actuación',grp('inc'),grp('sin'),grp('act'),grp('man')));
  F.append(sec('3. Dotaciones desplazadas (hasta 5 dotaciones)',...[0,1,2,3,4].map(i=>el('div',{className:'tr full'},el('b',{textContent:'D-'+(i+1)}),mini('dt'+i,'Tipo de vehículo / función'),mini('dp'+i,'Dotación de personal / código salida')))));
  F.append(sec('3B. Registro de personal interviniente',...PERS.map((p,i)=>el('div',{className:'tr p full'},el('b',{textContent:p}),mini('pn'+i,'Nombre y apellidos'),mini('pt'+i,'T.I.P. / N.I.P.'),mini('pu'+i,'Unidad / vehículo')))));
  F.append(sec('3C. Control de EPIs y equipos de protección',grp('epi','full'),fld('otroepi','Otro EPI (especificar)','text','w2'),fld('era','Cantidad bomberos con ERA','number'),fld('recargas','Recargas de ERA necesarias','number')));
  F.append(sec('4. Evaluación y cuerpos externos actuantes',grp('est'),grp('cue'),fld('otrosesp','Especificar otros','text','w2')));
  F.append(sec('5. Relato descriptivo y táctico de la intervención',el('div',{className:'full'},fld('relato','Relato','area'))));
  F.querySelector('textarea').rows=10;
  const annex=sec('Anexo A · Atención de víctimas (hasta 5 víctimas)');
  const ab=annex.querySelector('.body');
  for(let i=0;i<5;i++){
    const tri=el('div',{},...TR.map(([v,l])=>{const c=el('input',{type:'checkbox',checked:D['vt'+i]===v});
      c.onclick=()=>{D['vt'+i]=c.checked?v:'';tri.querySelectorAll('input').forEach(o=>o.checked=false);c.checked=D['vt'+i]===v;persist()};return el('label',{className:'ck'},c,l)}));
    ab.append(el('div',{className:'vc full'},el('b',{textContent:'V-0'+(i+1)}),el('div',{},mini('vn'+i,'Nombre y apellidos / DNI')),tri,mini('vu'+i,'Ubicación / hallazgo'),mini('vd'+i,'Destino / traslado SEM')));
  }
  ab.append(grp('tec','full'),grp('vit','full'),el('div',{className:'full'},fld('obs','A3. Observaciones sanitarias y detalles de transferencia','area')));
  const rad=['si','no'].map(v=>{const r=el('input',{type:'radio',name:'vict',checked:D.vict===v});r.onchange=()=>{D.vict=v;annex.hidden=v!=='si';persist()};return el('label',{className:'ck'},r,v==='si'?'SÍ (obligatorio cumplimentar el anexo)':'NO')});
  annex.hidden=D.vict!=='si';
  F.append(sec('6. Control de víctimas y firma del informe',el('div',{className:'full'},el('b',{textContent:'¿Existencia de víctimas en la intervención?'}),el('div',{className:'big'},...rad)),fld('autor','Nombre y apellidos del autor','text','w2'),fld('tip','T.I.P. / N.I.P.'),pad()));
  F.append(annex);
  F.append(el('p',{className:'note',textContent:'Los datos se guardan solo en este dispositivo. Al enviar se genera un PDF con el formato del informe.'}));
}

/* ---------- PDF ---------- */
const{PDFDocument,StandardFonts,rgb}=PDFLib;
async function mkPdf(){
  const pdf=await PDFDocument.create(),F=await pdf.embedFont(StandardFonts.Helvetica),B=await pdf.embedFont(StandardFonts.HelveticaBold);
  pdf.setTitle('Informe de servicio '+(D.inf||''));
  const W=595,H=842,M=34,CW=W-2*M,K=rgb(0,0,0),WH=rgb(1,1,1),GR=rgb(.35,.35,.35),LG=rgb(.92,.92,.92),kinds=[];let pg,y;
  const cl=s=>[...String(s??'')].map(c=>{try{F.widthOfTextAtSize(c,8);return c}catch(e){return '?'}}).join('');
  const wrap=(s,w,sz,f=F)=>String(s??'').split('\n').flatMap(p=>{p=cl(p);const o=[];let l='';for(const wd of p.split(' ')){const t=l?l+' '+wd:wd;if(l&&f.widthOfTextAtSize(t,sz)>w){o.push(l);l=wd}else l=t}o.push(l);return o});
  const txt=(s,x,yy,sz=8,f=F,c=K)=>pg.drawText(cl(s),{x,y:yy,size:sz,font:f,color:c});
  const rect=(x,yy,w,h,o={})=>pg.drawRectangle({x,y:yy,width:w,height:h,borderColor:K,borderWidth:.6,...o});
  const last=()=>kinds[kinds.length-1];
  const np=k=>{pg=pdf.addPage([W,H]);kinds.push(k);
    txt('bombers',M,H-46,24,B);txt('Generalitat de Catalunya',M+1,H-58,7,F,GR);
    const t1='INFORME DE SERVICIO';txt(t1,W/2-F.widthOfTextAtSize(t1,12)/2,H-42,12);
    if(k==='v'){const t2='(ATENCIÓN DE VÍCTIMAS)';txt(t2,W/2-F.widthOfTextAtSize(t2,10)/2,H-55,10)}
    else{const t='Colaboración del 112   INF- '+(D.inf||'');txt(t,W-M-B.widthOfTextAtSize(t,8),H-50,8,B)}
    y=H-70};
  const need=h=>{if(y-h<M+24)np(last()==='v'?'v':'c')};
  const bar=t=>{need(45);rect(M,y-13,CW,13,{color:K});txt(t,M+5,y-9.5,8.5,B,WH);y-=13};
  const row=(items,min=22)=>{
    const h=Math.max(min,...items.map(it=>it.draw?0:(it.l?10:3)+wrap(it.v,it.w*CW-8,it.sz||9,it.b?B:F).length*((it.sz||9)+1.5)+2));
    need(h);let x=M;
    for(const it of items){const w=it.w*CW,f=it.b?B:F,sz=it.sz||9;
      rect(x,y-h,w,h,it.fill?{color:it.fill}:{});
      if(it.l)txt(it.l,it.al==='c'?x+(w-B.widthOfTextAtSize(it.l,6.5))/2:x+3,y-8,6.5,B);
      if(it.draw)it.draw(x,y,w,h);
      else wrap(it.v,w-8,sz,f).forEach((l,j)=>{const lw=f.widthOfTextAtSize(l,sz);txt(l,it.al==='c'?x+(w-lw)/2:x+4,y-(it.l?17:sz+1)-j*(sz+1.5),sz,f)});
      x+=w}
    y-=h};
  const box=(x,yy,on)=>{rect(x,yy,7,7);if(on){const o={thickness:1.1,color:K};pg.drawLine({start:{x:x+1.3,y:yy+3.6},end:{x:x+3,y:yy+1.5},...o});pg.drawLine({start:{x:x+3,y:yy+1.5},end:{x:x+6,y:yy+6},...o})}};
  const grp=(g,x,top,w,cols=1)=>{const[t,it]=CG[g];txt(t,x,top-8,6.5,B);it.forEach(([k,l],i)=>{const cx=x+(i%cols)*(w/cols),cy=top-20-Math.floor(i/cols)*11;box(cx,cy,!!D[g+'.'+k]);txt(l,cx+10,cy+1,8)})};
  const gh=(g,cols)=>16+Math.ceil(CG[g][1].length/cols)*11;
  const tbox=(s,min)=>{let L=wrap(s,CW-10,9.5);
    for(;;){need(60);const av=y-(M+24),n=Math.max(1,Math.floor((av-8)/11.5)),take=L.splice(0,n),h=L.length?av:Math.min(av,Math.max(min,take.length*11.5+8));
      rect(M,y-h,CW,h);take.forEach((l,j)=>txt(l,M+5,y-13-j*11.5,9.5));y-=h;if(!L.length)break;np(last()==='v'?'v':'c')}};

  np('p');
  bar('1. DATOS GENERALES Y LOCALIZACIÓN');
  row([{l:'FECHA DEL SERVICIO',v:fd(D.fecha),w:.18},{l:'ZONA DE LOCALIZACIÓN (ABP)',v:D.zona,w:.27},{l:'LUGAR DE SALIDA',v:D.lugar,w:.27},{l:'MOTIVO INICIAL DE ALERTA',v:D.motivo,w:.28}]);
  row([{l:'MUNICIPIO / DISTRITO',v:D.muni,w:.45},{l:'DIRECCIÓN PRECISA / PUNTO KILOMÉTRICO / REFERENCIA',v:D.dir,w:.55}]);
  row(TIMES.map(([k,l])=>({l:l.toUpperCase(),v:D[k],w:1/6,al:'c'})),24);
  bar('2. CLASIFICACIÓN GENERAL DE LA ACTUACIÓN');
  {const h=Math.max(...['inc','sin','act','man'].map(g=>gh(g,1)));need(h);rect(M,y-h,CW,h);['inc','sin','act','man'].forEach((g,i)=>grp(g,M+4+i*CW/4,y,CW/4-6));y-=h}
  bar('3. DOTACIONES DESPLAZADAS (HASTA 5 DOTACIONES)');
  row([{v:'INDICATIVO',w:.14,b:1,sz:7,fill:LG},{v:'TIPO DE VEHÍCULO / FUNCIÓN',w:.46,b:1,sz:7,fill:LG},{v:'DOTACIÓN DE PERSONAL / CÓDIGO SALIDA',w:.4,b:1,sz:7,fill:LG}],12);
  for(let i=0;i<5;i++)row([{v:'D-'+(i+1)+':',w:.14,sz:8},{v:D['dt'+i],w:.46,sz:8},{v:D['dp'+i],w:.4,sz:8}],12);
  bar('3B. REGISTRO DE PERSONAL INTERVINIENTE');
  row([{v:'CARGO / INDICATIVO',w:.2,b:1,sz:7,fill:LG},{v:'NOMBRE Y APELLIDOS',w:.4,b:1,sz:7,fill:LG},{v:'T.I.P. / N.I.P.',w:.17,b:1,sz:7,fill:LG},{v:'UNIDAD / VEHÍCULO',w:.23,b:1,sz:7,fill:LG}],12);
  PERS.forEach((p,i)=>row([{v:p,w:.2,sz:8,b:i<4},{v:D['pn'+i],w:.4,sz:8},{v:D['pt'+i],w:.17,sz:8},{v:D['pu'+i],w:.23,sz:8}],12));
  bar('3C. CONTROL DE EPIS Y EQUIPOS DE PROTECCIÓN');
  {const h=50;need(h);rect(M,y-h,CW,h);grp('epi',M+4,y,CW*.62-8,3);txt('Otro EPI (especificar): '+(D.otroepi||''),M+4,y-h+6,8);
   const rx=M+CW*.64;txt('CONTROLERA / BOTELLAS',rx,y-9,6.5,B);txt('Cantidad bomberos con ERA: '+(D.era||'____'),rx,y-24,8);txt('Recargas de ERA necesarias: '+(D.recargas||'____'),rx,y-36,8);y-=h}
  bar('4. EVALUACIÓN Y CUERPOS EXTERNOS ACTUANTES');
  {const h=46;need(h);rect(M,y-h,CW,h);grp('est',M+4,y,CW*.58-8,2);const rx=M+CW*.6;grp('cue',rx,y,CW*.4-6,3);txt('Especificar otros: '+(D.otrosesp||''),rx,y-h+5,7.5);y-=h}
  bar('5. RELATO DESCRIPTIVO Y TÁCTICO DE LA INTERVENCIÓN');
  tbox(D.relato,90);
  bar('6. CONTROL DE VÍCTIMAS Y FIRMA DEL INFORME');
  {const h=84;need(h);rect(M,y-h,CW,h);const mx=M+CW*.5;pg.drawLine({start:{x:mx,y:y},end:{x:mx,y:y-h},thickness:.6,color:K});
   const q='¿EXISTENCIA DE VÍCTIMAS EN LA INTERVENCIÓN?';txt(q,M+CW*.25-B.widthOfTextAtSize(q,8.5)/2,y-34,8.5,B);
   box(M+30,y-58,D.vict==='si');txt('SÍ (OBLIGATORIO CUMPLIMENTAR ANEXO)',M+42,y-57,7.5,B);box(M+CW*.5-50,y-58,D.vict==='no');txt('NO',M+CW*.5-39,y-57,8,B);
   txt('FIRMA Y DATOS DEL AUTOR DEL INFORME',mx+6,y-9,6.5,B);txt('Nombre y Apellidos: '+(D.autor||''),mx+6,y-23,8);txt('T.I.P. / N.I.P.: '+(D.tip||''),mx+6,y-35,8);
   rect(mx+6,y-h+5,CW*.5-12,38);txt('Firma',mx+CW*.5-34,y-h+9,6.5,F,GR);
   if(D.firma){const im=await pdf.embedPng(D.firma),s=Math.min((CW*.5-20)/im.width,32/im.height);pg.drawImage(im,{x:mx+10,y:y-h+8,width:im.width*s,height:im.height*s})}
   y-=h}

  const anyV=D.vict==='si'||[0,1,2,3,4].some(i=>D['vn'+i]||D['vt'+i]||D['vu'+i]||D['vd'+i])||D.obs||Object.keys(D).some(k=>/^(tec|vit)\./.test(k)&&D[k]);
  if(anyV){
    np('v');bar('A1. RELACIÓN DE VÍCTIMAS (HASTA 5 VÍCTIMAS)');
    row([{v:'ID',w:.07,b:1,sz:7,fill:LG},{v:'NOMBRE Y APELLIDOS / DNI',w:.28,b:1,sz:7,fill:LG},{v:'CATEGORÍA DE TRIAJE (MARCAR)',w:.25,b:1,sz:7,fill:LG},{v:'UBICACIÓN / HALLAZGO',w:.2,b:1,sz:7,fill:LG},{v:'DESTINO / TRASLADO SEM',w:.2,b:1,sz:7,fill:LG}],12);
    for(let i=0;i<5;i++)row([{v:'V-0'+(i+1),w:.07,b:1,sz:8},{v:D['vn'+i],w:.28,sz:8},
      {v:'',w:.25,draw:(x,yt,w)=>TR.forEach(([v,l],j)=>{const bx=x+4+(j%2)*(w/2),by=yt-14-Math.floor(j/2)*12;box(bx,by,D['vt'+i]===v);txt(l,bx+10,by+1,8)})},
      {v:D['vu'+i],w:.2,sz:8},{v:D['vd'+i],w:.2,sz:8}],30);
    bar('A2. VALORACIÓN DE RESCATE Y MANIOBRAS DE EXCARCELACIÓN');
    {const h=gh('tec',1);need(h);rect(M,y-h,CW,h);grp('tec',M+4,y,CW/2-8);grp('vit',M+CW/2+4,y,CW/2-8);y-=h}
    bar('A3. OBSERVACIONES SANITARIAS Y DETALLES DE TRANSFERENCIA');
    tbox(D.obs,260);
  }
  const ps=pdf.getPages();
  ps.forEach((p,i)=>{pg=p;pg.drawLine({start:{x:M,y:M+12},end:{x:W-M,y:M+12},thickness:.6,color:K});
    txt("Bombers de la Generalitat de Catalunya - Servei d'Emergències i Salvaments",M,M,6.5,B);
    const c=kinds[i]==='v'?'Anexo de Víctimas':'Parte Principal';txt(c,W/2+40,M,6.5,B);
    const n='Página '+(i+1)+' de '+ps.length;txt(n,W-M-B.widthOfTextAtSize(n,6.5),M,6.5,B)});
  return pdf.save();
}

/* ---------- Guardar y enviar ---------- */
const fname=()=>('informe-servicio'+(D.inf?'-INF-'+D.inf:'')+(D.fecha?'-'+D.fecha:'')).replace(/[^\w\-]+/g,'_')+'.pdf';
async function save(bytes,name){
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:bytes});return true}catch(e){if(e&&e.code==='declined')return false}}
  const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=el('a',{href:u,download:name});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
}
function check(){if(!D.vict){toast('Indica en la sección 6 si hay víctimas (SÍ / NO)');return false}return true}
async function run(fn){const bs=[$('#bPdf'),$('#bSend')];bs.forEach(b=>b.disabled=true);try{await fn()}catch(e){toast('No se pudo generar el PDF')}bs.forEach(b=>b.disabled=false)}
$('#bPdf').onclick=()=>check()&&run(async()=>{if(await save(await mkPdf(),fname()))toast('PDF listo')});
$('#bSend').onclick=()=>check()&&run(async()=>{
  const bytes=await mkPdf(),name=fname(),subj='Informe de servicio'+(D.inf?' INF-'+D.inf:'')+(D.fecha?' · '+fd(D.fecha):'');
  const body=[subj,D.muni&&'Municipio: '+D.muni,D.lugar&&'Lugar: '+D.lugar,D.autor&&'Autor: '+D.autor,'','(Se adjunta el informe en PDF)'].filter(x=>x!==''&&x!==undefined&&x!==false||x==='').join('\n');
  try{const f=new File([bytes],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:subj,text:body});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  if(!await save(bytes,name))return;
  const a=el('a',{href:'mailto:'+(D.to||'')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body),target:'_blank'});
  document.body.append(a);a.click();a.remove();
  toast('PDF descargado. Adjúntalo al correo que se ha abierto.');
});
$('#to').value=D.to||'';$('#to').oninput=e=>{D.to=e.target.value.trim();persist()};
$('#bNew').onclick=()=>{
  if(!confirm('¿Empezar un informe nuevo? Se borrarán los datos actuales (se conservan tu nombre, firma y correo).'))return;
  D={to:D.to,autor:D.autor,tip:D.tip,firma:D.firma,fecha:new Date().toISOString().slice(0,10)};persist();render();scrollTo(0,0);
};
render();
})();
</script>
