<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de PDF gratis</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef2;--panel:#fff;--fg:#1b1d24;--mut:#6a6f7d;--acc:#2f5bea;--accfg:#fff;--bd:#d6d9e1;--sel:#2f5bea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--panel:#1f222a;--fg:#e8eaf0;--mut:#9aa0b0;--acc:#6d8cff;--accfg:#0d1020;--bd:#363a46;--sel:#6d8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1f222a;--fg:#e8eaf0;--mut:#9aa0b0;--acc:#6d8cff;--accfg:#0d1020;--bd:#363a46;--sel:#6d8cff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;padding:8px 10px;overflow-x:auto;white-space:nowrap}
header .sep{width:1px;align-self:stretch;background:var(--bd);margin:0 4px}
button,.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover:not(:disabled){background:var(--bg)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600;margin-left:auto}
input[type=color]{width:32px;height:30px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:transparent}
#zl{min-width:44px;text-align:center;color:var(--mut)}
#hint{padding:6px 12px;color:var(--mut);font-size:13px;text-align:center}
#empty{max-width:560px;margin:8vh auto;padding:36px 24px;text-align:center;background:var(--panel);border:2px dashed var(--bd);border-radius:16px}
#empty.drag{border-color:var(--acc)}
#empty h1{font-size:24px;margin:0 0 8px}
#empty p{color:var(--mut);margin:6px 0 18px}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 8px 60px}
.page{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.layer{position:absolute;inset:0}
.layer.tool{cursor:crosshair}
.tb{position:absolute;display:none;cursor:text;border-radius:2px}
.layer.edit .tb{display:block;background:rgba(47,91,234,.12);outline:1px solid rgba(47,91,234,.45)}
.layer.edit .tb:hover{background:rgba(47,91,234,.32)}
.an{position:absolute;touch-action:none}
.an.sel{outline:2px solid var(--sel);outline-offset:2px}
.an.text .tx{font-family:Helvetica,Arial,sans-serif;line-height:1.2;white-space:pre;min-width:2ch;min-height:1.2em;outline:none;padding:0;cursor:text}
.an.text .tx:empty::before{content:"Escribe…";opacity:.4}
.an .grip{position:absolute;left:-18px;top:-2px;width:16px;height:16px;border-radius:4px;background:var(--sel);cursor:grab;display:none;touch-action:none}
.an.sel .grip{display:block}
.an.sig,.an.white,.an.check{cursor:move}
.an.white{background:#fff}
.an img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.an svg{width:100%;height:100%;display:block;pointer-events:none}
.an .rs{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--sel);border-radius:3px;cursor:nwse-resize;display:none;touch-action:none}
.an.sel .rs{display:block}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--panel);color:var(--fg);padding:18px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
#dc{width:100%;height:auto;aspect-ratio:13/5;background:#fff;border:1px solid var(--bd);border-radius:10px;touch-action:none;cursor:crosshair}
#tt{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
#tp{font:600 54px 'Dancing Script',cursive;background:#fff;color:#111;border-radius:10px;padding:8px 14px;margin-top:10px;min-height:92px;overflow:hidden;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;justify-content:flex-end}
.pane{display:none}.pane.on{display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<header id="bar">
  <button id="bOpen">📂 Abrir</button><input id="fi" type="file" accept="application/pdf,.pdf" hidden>
  <span class="sep"></span>
  <button id="t-select" class="on" data-tool="select" disabled>↖ Mover</button>
  <button data-tool="edit" disabled title="Reemplaza el texto que ya tiene el PDF">✎ Editar texto</button>
  <button data-tool="text" disabled>T Texto</button>
  <button data-tool="check" disabled>✓ Marca</button>
  <button data-tool="date" disabled>📅 Fecha</button>
  <button data-tool="sig" disabled>✍ Firma</button>
  <button id="bNewSig" disabled title="Crear otra firma">＋</button>
  <button data-tool="white" disabled title="Tapa contenido con un recuadro blanco">▭ Tapar</button>
  <span class="sep"></span>
  <button id="sm" disabled>A−</button><button id="sp" disabled>A+</button>
  <input id="col" type="color" value="#111111" disabled title="Color">
  <button id="del" disabled>🗑</button>
  <span class="sep"></span>
  <button id="zm" disabled>−</button><span id="zl">125%</span><button id="zp" disabled>+</button>
  <button id="bSave" class="pri" disabled>⬇ Descargar PDF</button>
</header>
<div id="hint">Todo se procesa en tu dispositivo. Tu PDF no se sube a ningún servidor.</div>
<main>
  <section id="empty">
    <h1>Editor de PDF gratis</h1>
    <p>Rellena huecos, añade texto, marcas, fechas y tu firma. Sin registro y sin marcas de agua.</p>
    <button id="bOpen2" class="pri" style="margin:0">Elegir un PDF</button>
    <p style="margin:14px 0 0;font-size:13px">o arrastra el archivo aquí</p>
  </section>
  <div id="pages" hidden></div>
</main>

<dialog id="dlg">
  <div class="tabs">
    <button data-pane="p1" class="on">Dibujar</button><button data-pane="p2">Escribir</button><button data-pane="p3">Imagen</button>
  </div>
  <div id="p1" class="pane on">
    <canvas id="dc" width="1040" height="400"></canvas>
    <div class="row" style="justify-content:space-between"><span><input id="ink" type="color" value="#111111"> Tinta</span><button id="dClr">Borrar</button></div>
  </div>
  <div id="p2" class="pane"><input id="tt" placeholder="Tu nombre" maxlength="40"><div id="tp"></div></div>
  <div id="p3" class="pane">
    <input id="fImg" type="file" accept="image/*">
    <label style="display:block;margin-top:10px"><input id="rmBg" type="checkbox" checked> Quitar fondo blanco</label>
  </div>
  <div class="row"><button id="sCancel">Cancelar</button><button id="sOk" class="pri" style="margin:0">Usar firma</button></div>
</dialog>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const st={bytes:null,pdf:null,name:'documento.pdf',pages:[],zoom:1.25,tool:'select',sel:null,ann:[],sig:null,gen:0};
let uid=0, obs=null, tt=0;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function hint(m){$('#hint').textContent=m}
const HINTS={select:'Toca un elemento para moverlo o editarlo.',edit:'Haz clic en cualquier texto resaltado del PDF para reemplazarlo. Si lo dejas vacío, se borra.',text:'Haz clic donde quieras escribir.',check:'Haz clic donde quieras la marca ✓.',date:'Haz clic donde quieras la fecha.',sig:'Haz clic donde quieras colocar la firma.',white:'Haz clic donde quieras el recuadro blanco. Después puedes ajustar su tamaño.'};

/* ---------- Abrir ---------- */
async function openFile(f){
  if(!f)return;
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){toast('Eso no parece un PDF');return}
  if(st.ann.length&&!confirm('Se perderán los cambios del documento actual. ¿Continuar?'))return;
  try{
    const buf=new Uint8Array(await f.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data:buf.slice()}).promise;
    st.pages=[];
    for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),v=p.getViewport({scale:1});st.pages.push({p,w:v.width,h:v.height})}
    Object.assign(st,{bytes:buf,pdf,name:f.name,ann:[],sel:null});
    const avail=Math.min(window.innerWidth-24,1100);
    st.zoom=Math.max(.5,Math.min(1.6,avail/st.pages[0].w));
    $('#empty').hidden=true;$('#pages').hidden=false;
    $$('header button:not(#bOpen)').forEach(b=>b.disabled=false);
    $('#col').disabled=false;
    setTool('select');build();sync();
    toast(st.pages.length+(st.pages.length===1?' página cargada':' páginas cargadas'));
  }catch(e){
    toast(e&&e.name==='PasswordException'?'El PDF tiene contraseña: quítasela antes de editarlo':'No se pudo abrir este PDF');
  }
}
$('#bOpen').onclick=$('#bOpen2').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#empty').classList.add('drag')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#empty').classList.remove('drag')}));
document.addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));

/* ---------- Páginas ---------- */
function build(){
  const box=$('#pages');box.innerHTML='';obs&&obs.disconnect();st.gen++;
  const gen=st.gen;
  obs=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting&&!en.target._done){en.target._done=true;draw(en.target,+en.target.dataset.i,gen)}
  }),{rootMargin:'600px 0px'});
  st.pages.forEach((pg,i)=>{
    const d=document.createElement('div');d.className='page';d.dataset.i=i;
    d.style.width=pg.w*st.zoom+'px';d.style.height=pg.h*st.zoom+'px';
    const c=document.createElement('canvas'),l=document.createElement('div');l.className='layer';
    l.onclick=e=>layerClick(e,i,l);
    d.append(c,l);box.append(d);obs.observe(d);buildTb(i,l,gen);
  });
  st.ann.forEach(a=>$$('.layer')[a.p].append(mk(a)));
  $('#zl').textContent=Math.round(st.zoom*100)+'%';
  paintTool();
}
async function draw(d,i,gen){
  const dpr=Math.min(window.devicePixelRatio||1,2),vp=st.pages[i].p.getViewport({scale:st.zoom*dpr}),c=d.querySelector('canvas');
  c.width=vp.width;c.height=vp.height;
  try{await st.pages[i].p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}catch(e){}
}
async function buildTb(i,l,gen){
  const pg=st.pages[i];
  if(!pg.tc){try{pg.tc=(await pg.p.getTextContent()).items}catch(e){pg.tc=[]}}
  if(gen!==st.gen)return;
  pg.used=pg.used||new Set();
  const vt=pg.p.getViewport({scale:1}).transform,z=st.zoom;
  pg.tc.forEach((it,k)=>{
    if(!it.str||!it.str.trim()||pg.used.has(k))return;
    const m=pdfjsLib.Util.transform(vt,it.transform),size=Math.hypot(m[2],m[3]);
    if(!size||Math.abs(m[1])>.5)return;
    const d={str:it.str,x:m[4],by:m[5],size,w:it.width,top:m[5]-size*.95,h:size*1.2};
    const b=document.createElement('div');b.className='tb';
    b.style.left=(d.x-1)*z+'px';b.style.top=d.top*z+'px';b.style.width=(d.w+2)*z+'px';b.style.height=d.h*z+'px';
    b.onclick=e=>{e.stopPropagation();editItem(i,k,d,b)};
    l.append(b);
  });
}
function editItem(i,k,d,b){
  st.pages[i].used.add(k);b.remove();
  const l=$$('.layer')[i];
  const wh={id:++uid,p:i,t:'white',x:d.x-1,y:d.top,w:d.w+3,h:d.h};
  const tx={id:++uid,p:i,t:'text',x:d.x,y:d.by-d.size*.945,s:Math.round(d.size*10)/10,c:'#111111',txt:d.str};
  st.ann.push(wh,tx);l.append(mk(wh),mk(tx));setTool('select');select(tx.id);
  const e=l.querySelector('.an[data-id="'+tx.id+'"] .tx');e.focus();
  const r=document.createRange();r.selectNodeContents(e);const s=getSelection();s.removeAllRanges();s.addRange(r);
  dirty();
}
function zoom(f){st.zoom=Math.max(.4,Math.min(3,st.zoom*f));build();select(st.sel)}
$('#zm').onclick=()=>zoom(1/1.2);$('#zp').onclick=()=>zoom(1.2);

/* ---------- Herramientas ---------- */
function setTool(t){st.tool=t;paintTool();hint(HINTS[t]||'')}
function paintTool(){
  $$('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===st.tool));
  $$('.layer').forEach(l=>{l.classList.toggle('tool',st.tool!=='select');l.classList.toggle('edit',st.tool==='edit')});
}
$$('[data-tool]').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tool;
  if(t==='sig'&&!st.sig){openSig();return}
  setTool(st.tool===t&&t!=='select'?'select':t);
});
$('#bNewSig').onclick=openSig;

function layerClick(e,p,l){
  if(e.target!==l)return;
  if(st.tool==='select'){select(null);return}
  const r=l.getBoundingClientRect(),x=(e.clientX-r.left)/st.zoom,y=(e.clientY-r.top)/st.zoom;
  const a={id:++uid,p,t:st.tool,x,y,c:$('#col').value};
  if(a.t==='text'||a.t==='date'){a.s=14;a.txt=a.t==='date'?new Date().toLocaleDateString('es-ES'):'';a.t='text';a.y-=8}
  else if(a.t==='check'){a.s=18;a.x-=9;a.y-=9}
  else if(a.t==='sig'){a.w=170;a.h=a.w/st.sig.r;a.url=st.sig.url;a.x-=a.w/2;a.y-=a.h/2}
  else if(a.t==='white'){a.w=120;a.h=22}
  clamp(a);st.ann.push(a);
  const el=mk(a);l.append(el);setTool('select');select(a.id);
  if(a.t==='text'){const tx=el.querySelector('.tx');tx.focus()}
  dirty();
}
function clamp(a){
  const pg=st.pages[a.p],w=a.w||a.s||20,h=a.h||a.s||20;
  a.x=Math.max(0,Math.min(pg.w-Math.min(w,pg.w),a.x));a.y=Math.max(0,Math.min(pg.h-Math.min(h,pg.h),a.y));
}

/* ---------- Elementos ---------- */
function mk(a){
  const z=st.zoom,el=document.createElement('div');
  el.className='an '+a.t+(a.id===st.sel?' sel':'');el.dataset.id=a.id;
  el.style.left=a.x*z+'px';el.style.top=a.y*z+'px';
  if(a.t==='text'){
    el.style.fontSize=a.s*z+'px';el.style.color=a.c;
    const g=document.createElement('div');g.className='grip';
    const tx=document.createElement('div');tx.className='tx';
    tx.contentEditable='plaintext-only';if(tx.contentEditable!=='plaintext-only')tx.contentEditable='true';
    tx.textContent=a.txt;
    tx.oninput=()=>{a.txt=tx.innerText.replace(/\n$/,'');dirty()};
    tx.onfocus=()=>select(a.id);
    tx.onblur=()=>{if(!a.txt.trim()){rm(a.id)}};
    tx.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text/plain')||'').slice(0,2000))};
    el.append(g,tx);drag(g,a,el,'move');
  }else if(a.t==='check'){
    el.style.width=el.style.height=a.s*z+'px';
    el.innerHTML='<svg viewBox="0 0 100 100"><polyline points="10,55 40,85 90,15" fill="none" stroke="'+a.c+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    drag(el,a,el,'move');
  }else{
    el.style.width=a.w*z+'px';el.style.height=a.h*z+'px';
    if(a.t==='sig'){const im=new Image();im.src=a.url;el.append(im)}
    const rs=document.createElement('div');rs.className='rs';el.append(rs);
    drag(el,a,el,'move');drag(rs,a,el,'size');
  }
  el.addEventListener('pointerdown',()=>select(a.id));
  return el;
}
function drag(h,a,el,mode){
  h.addEventListener('pointerdown',e=>{
    if(mode==='move'&&e.target.classList.contains('rs'))return;
    e.preventDefault();e.stopPropagation();select(a.id);
    const sx=e.clientX,sy=e.clientY,ox=a.x,oy=a.y,ow=a.w,oh=a.h,z=st.zoom;
    h.setPointerCapture(e.pointerId);
    const mv=ev=>{
      const dx=(ev.clientX-sx)/z,dy=(ev.clientY-sy)/z;
      if(mode==='move'){a.x=ox+dx;a.y=oy+dy;clamp(a);el.style.left=a.x*z+'px';el.style.top=a.y*z+'px'}
      else{const r=ow/oh;a.w=Math.max(20,ow+dx);a.h=a.t==='sig'?a.w/r:Math.max(8,oh+dy);el.style.width=a.w*z+'px';el.style.height=a.h*z+'px'}
    };
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);dirty()};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}
function select(id){
  st.sel=id;
  $$('.an').forEach(e=>e.classList.toggle('sel',+e.dataset.id===id));
  const a=cur();
  $('#del').disabled=!a;
  $('#sm').disabled=$('#sp').disabled=!(a&&(a.t==='text'||a.t==='check'));
  if(a&&a.c)$('#col').value=a.c;
}
const cur=()=>st.ann.find(a=>a.id===st.sel);
function rm(id){
  st.ann=st.ann.filter(a=>a.id!==id);
  const e=$('.an[data-id="'+id+'"]');e&&e.remove();
  if(st.sel===id)select(null);
}
function refresh(a){const o=$('.an[data-id="'+a.id+'"]');if(o){const n=mk(a);o.replaceWith(n);if(a.t==='text')n.querySelector('.tx').focus()}}
$('#del').onclick=()=>{const a=cur();a&&rm(a.id)};
$('#sm').onclick=()=>{const a=cur();if(a){a.s=Math.max(6,a.s-1);refresh(a)}};
$('#sp').onclick=()=>{const a=cur();if(a){a.s=Math.min(96,a.s+1);refresh(a)}};
$('#col').oninput=e=>{const a=cur();if(a&&a.c){a.c=e.target.value;refresh(a)}};
document.addEventListener('keydown',e=>{
  const ed=document.activeElement&&(document.activeElement.isContentEditable||/INPUT|TEXTAREA/.test(document.activeElement.tagName));
  if((e.key==='Delete'||e.key==='Backspace')&&!ed&&st.sel){e.preventDefault();rm(st.sel)}
  if(e.key==='Escape'){setTool('select');select(null);document.activeElement&&document.activeElement.blur()}
});
function dirty(){sync()}
function sync(){$('#bSave').disabled=!st.pdf}
window.addEventListener('beforeunload',e=>{if(st.ann.length){e.preventDefault();e.returnValue=''}});

/* ---------- Firma ---------- */
const dlg=$('#dlg'),dc=$('#dc'),dx=dc.getContext('2d');let drawing=false,inked=false,imgSig=null;
function openSig(){clearDraw();$('#tt').value='';$('#tp').textContent='';imgSig=null;dlg.showModal()}
$$('[data-pane]').forEach(b=>b.onclick=()=>{
  $$('[data-pane]').forEach(x=>x.classList.toggle('on',x===b));
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.pane));
});
function clearDraw(){dx.clearRect(0,0,dc.width,dc.height);inked=false}
$('#dClr').onclick=clearDraw;
function pt(e){const r=dc.getBoundingClientRect();return[(e.clientX-r.left)*dc.width/r.width,(e.clientY-r.top)*dc.height/r.height]}
dc.onpointerdown=e=>{drawing=true;dc.setPointerCapture(e.pointerId);const[x,y]=pt(e);dx.strokeStyle=$('#ink').value;dx.lineWidth=6;dx.lineCap=dx.lineJoin='round';dx.beginPath();dx.moveTo(x,y);dx.lineTo(x+.1,y+.1);dx.stroke();inked=true};
dc.onpointermove=e=>{if(!drawing)return;const[x,y]=pt(e);dx.lineTo(x,y);dx.stroke()};
dc.onpointerup=dc.onpointercancel=()=>{drawing=false};
$('#tt').oninput=e=>{$('#tp').textContent=e.target.value;document.fonts&&document.fonts.load("600 80px 'Dancing Script'")};
$('#fImg').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{imgSig=im;toast('Imagen lista')};im.src=URL.createObjectURL(f);
};
function trim(c){
  const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let y=0;y<c.height;y++)for(let i=0;i<c.width;i++)if(d[(y*c.width+i)*4+3]>12){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<x0)return null;
  const p=6,o=document.createElement('canvas');o.width=x1-x0+1+p*2;o.height=y1-y0+1+p*2;
  o.getContext('2d').drawImage(c,x0,y0,x1-x0+1,y1-y0+1,p,p,x1-x0+1,y1-y0+1);return o;
}
$('#sCancel').onclick=()=>dlg.close();
$('#sOk').onclick=async()=>{
  const pane=$('.pane.on').id;let c=null;
  if(pane==='p1'&&inked){c=document.createElement('canvas');c.width=dc.width;c.height=dc.height;c.getContext('2d').drawImage(dc,0,0)}
  else if(pane==='p2'&&$('#tt').value.trim()){
    try{await document.fonts.load("600 120px 'Dancing Script'")}catch(e){}
    const f="600 120px 'Dancing Script',cursive",m=document.createElement('canvas').getContext('2d');m.font=f;
    c=document.createElement('canvas');c.width=Math.ceil(m.measureText($('#tt').value).width)+40;c.height=220;
    const x=c.getContext('2d');x.font=f;x.fillStyle=$('#ink').value;x.textBaseline='middle';x.fillText($('#tt').value,20,110);
  }else if(pane==='p3'&&imgSig){
    const s=Math.min(1,900/imgSig.width);c=document.createElement('canvas');c.width=imgSig.width*s;c.height=imgSig.height*s;
    const x=c.getContext('2d');x.drawImage(imgSig,0,0,c.width,c.height);
    if($('#rmBg').checked){const id=x.getImageData(0,0,c.width,c.height),d=id.data;
      for(let i=0;i<d.length;i+=4){const l=(d[i]+d[i+1]+d[i+2])/3;if(l>225)d[i+3]=0;else if(l>150)d[i+3]=Math.round(255*(225-l)/75)}
      x.putImageData(id,0,0)}
  }
  const t=c&&trim(c);
  if(!t){toast('Crea primero una firma');return}
  st.sig={url:t.toDataURL('image/png'),r:t.width/t.height};
  dlg.close();setTool('sig');
};

/* ---------- Exportar ---------- */
const hex=h=>{const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)};
async function exportPdf(){
  const{PDFDocument,StandardFonts,rgb}=PDFLib;
  const doc=await PDFDocument.load(st.bytes,{ignoreEncryption:true});
  const font=await doc.embedFont(StandardFonts.Helvetica),pgs=doc.getPages();
  const clean=s=>[...s].map(ch=>{try{font.widthOfTextAtSize(ch,10);return ch}catch(e){return '?'}}).join('');
  for(const a of st.ann){
    const pg=pgs[a.p],cb=pg.getCropBox(),top=cb.y+cb.height,X=cb.x+a.x;
    if(a.t==='text'){
      a.txt.split('\n').forEach((ln,i)=>{if(ln)pg.drawText(clean(ln),{x:X,y:top-a.y-a.s*.945-i*a.s*1.2,size:a.s,font,color:hex(a.c)})});
    }else if(a.t==='check'){
      const P=(u,v)=>({x:X+u*a.s,y:top-a.y-v*a.s}),o={thickness:a.s*.12,color:hex(a.c),lineCap:1};
      pg.drawLine({start:P(.1,.55),end:P(.4,.85),...o});pg.drawLine({start:P(.4,.85),end:P(.9,.15),...o});
    }else if(a.t==='white'){
      pg.drawRectangle({x:X,y:top-a.y-a.h,width:a.w,height:a.h,color:rgb(1,1,1)});
    }else if(a.t==='sig'){
      const im=await doc.embedPng(a.url);pg.drawImage(im,{x:X,y:top-a.y-a.h,width:a.w,height:a.h});
    }
  }
  return doc.save();
}
async function saveFile(bytes,name){
  let dl=null;
  try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:bytes});toast('PDF listo');return}
    catch(e){if(e&&e.code==='declined')return}
  }
  const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');
  a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast('PDF listo');
}
$('#bSave').onclick=async()=>{
  const b=$('#bSave');b.disabled=true;
  try{
    if(document.activeElement)document.activeElement.blur();
    const bytes=await exportPdf();
    await saveFile(bytes,st.name.replace(/\.pdf$/i,'')+'-editado.pdf');
  }catch(e){toast('No se pudo generar el PDF')}
  b.disabled=false;
};
})();
</script>
